

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>My Todo App</h1>
  </header>

  <main>
    <input id="todoInput" type="text" placeholder="Enter a task">
    <button id="addBtn">Add</button>
    <ul id="todoList"></ul>
  </main>

  <footer>
    <p>&copy; <span id="date"></span> Todo</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
